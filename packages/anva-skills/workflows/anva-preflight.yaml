name: "anva-preflight"
description: "Review a local diff against Anva requirements, policy, provenance, and repository-defined checks before pull-request creation. Use for advisory readiness review only; never report authoritative server assurance, deployment safety, or approval."
phase: "PREFLIGHT"
implicit: true
read_tools:
  - "anva.resolve_repository"
  - "anva.resolve_work_item"
  - "anva.get_context_packet"
  - "anva.get_requirements"
  - "anva.get_repository_profile"
  - "anva.get_policy_bundle"
  - "anva.explain_assertion"
  - "anva.get_source_excerpt"
proposal_tools:
  - "anva.submit_preflight_summary"
steps:
  - "Resolve the exact repository and work item for the local change."
  - "Request one minimum relevant PREFLIGHT packet tied to the task."
  - "Inspect the exact local diff and commit without sending raw repository content to Anva."
  - "Select and run repository-defined checks appropriate to changed paths and policy."
  - "Map every material finding to local evidence and normalized Anva provenance."
  - "Report missing tests, documentation, migrations, evidence, conflicts, and unavailable checks."
  - "Preview an advisory summary and request explicit intent before proposing it."
stop_conditions:
  - "The diff or commit under review is ambiguous."
  - "The work item cannot be resolved."
  - "Required provenance is absent for a material alignment claim."
degraded_behavior:
  - "Local checks may run, but readiness and Anva alignment remain UNVERIFIED."
  - "Never output READY, PASSED ASSURANCE, SAFE_TO_DEPLOY, or equivalent wording."
  - "Do not submit an advisory summary when proposal capability is unavailable or read-only."
output_schema: "shared/output-schemas/preflight.schema.json"
output_sections:
  - "Review target"
  - "Advisory status"
  - "Requirements coverage"
  - "Policy findings"
  - "Checks"
  - "Missing evidence"
  - "Conflicts"
  - "Assumptions"
  - "Limitations"
  - "Anva sources"
  - "Proposal"
