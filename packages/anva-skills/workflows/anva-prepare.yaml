name: "anva-prepare"
description: "Prepare an implementation task with live, permission-filtered Anva context. Use when starting an issue, clarifying requirements, defining acceptance criteria, or planning verification; do not use it to claim approval or authoritative assurance."
phase: "PREPARE"
implicit: true
read_tools:
  - "anva.resolve_repository"
  - "anva.resolve_work_item"
  - "anva.get_context_packet"
  - "anva.get_requirements"
  - "anva.get_repository_profile"
  - "anva.get_policy_bundle"
  - "anva.explain_assertion"
  - "anva.get_source_excerpt"
proposal_tools: []
steps:
  - "Resolve the exact credential-bound repository before looking up any task."
  - "Resolve the work item by its opaque identifier or external key."
  - "Request one minimum relevant PREPARE context packet for the stated task."
  - "Use packet citations and assertion explanations for every material organizational claim."
  - "Separate confirmed facts, requirements, assumptions, conflicts, and limitations."
  - "Return acceptance criteria plus implementation and verification plans within approved scope."
stop_conditions:
  - "The organization or repository cannot be resolved."
  - "The task has a material unresolved knowledge conflict."
  - "A blocking requirement or policy remains ambiguous."
degraded_behavior:
  - "Label organizational alignment UNVERIFIED and make no Anva-derived claim."
  - "Offer a local-only draft only after the user explicitly accepts degraded work."
  - "List unavailable authentication, repository, contract, and provenance as limitations."
output_schema: "shared/output-schemas/prepare.schema.json"
output_sections:
  - "Problem"
  - "Confirmed requirements"
  - "Out of scope"
  - "Assumptions"
  - "Conflicts"
  - "Acceptance criteria"
  - "Affected systems and owners"
  - "Relevant decisions and policies"
  - "Implementation plan"
  - "Verification plan"
  - "Unresolved questions"
  - "Limitations"
  - "Anva sources"
