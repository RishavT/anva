name: Release Anva

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact release tag to publish
        required: true
        default: v0.1.3
        type: string
      source_commit:
        description: Full immutable commit expected at the existing release tag
        required: true
        type: string
      risk_expires_on:
        description: UTC expiry date for the exact-candidate risk decision (maximum 30 days)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.1.3
  cancel-in-progress: false

env:
  ANVA_VERSION: 0.1.3
  BUILDKIT_PROGRESS: plain
  ANVA_IMAGE_REPOSITORY: ghcr.io/rishavt/anva
  ANVA_SOURCE_PREDICATE_TYPE: https://github.com/RishavT/anva/attestations/source/v1
  ANVA_TRIVY_IMAGE: aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e
  ANVA_TRIVY_CACHE_DIR: /tmp
  ANVA_REGISTRY_IMAGE: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
  ANVA_BUILDKIT_IMAGE: moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528
  ANVA_SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:9c68e585103448f7e4abb835132ffe9759d7a962a0fa426035775956e7a1e021

jobs:
  candidate:
    name: Build exact risk proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      proposal_sha256: ${{ steps.proposal.outputs.sha256 }}
    env:
      COMPOSE_PROJECT: anva-release-proposal-${{ github.run_id }}
    steps:
      - name: Check out the exact candidate tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Verify exact candidate identity
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "RishavT"
          test "$RELEASE_TAG" = "v${ANVA_VERSION}"
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          source_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled=$1 }
            $2 !~ /\^\{\}$/ { direct=$1 }
            END { print peeled ? peeled : direct }
          ')"
          test "$source_commit" = "$EXPECTED_SOURCE_COMMIT"
          test "$remote_commit" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_COMMIT" origin/main
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$ANVA_VERSION"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          {
            echo "ANVA_REVISION=$EXPECTED_SOURCE_COMMIT"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$EXPECTED_SOURCE_COMMIT")"
            echo "ANVA_BUILD_INPUT_SHA256=$(git archive --format=tar "$EXPECTED_SOURCE_COMMIT" | sha256sum | cut -d' ' -f1)"
            echo "ANVA_HOST_UID=$(id -u)"
            echo "ANVA_HOST_GID=$(id -g)"
            echo "ANVA_DOCKER_GID=$docker_gid"
          } >> "$GITHUB_ENV"

      - name: Build release assets without applying a risk decision
        env:
          CACHE_VOLUME: anva-release-proposal-${{ github.run_id }}_release-trivy-cache
        run: |
          set -euo pipefail
          test ! "$(docker volume ls -q --filter "name=^${CACHE_VOLUME}$")"
          docker volume create \
            --label "com.docker.compose.project=$COMPOSE_PROJECT" \
            --label "com.docker.compose.volume=release-trivy-cache" \
            "$CACHE_VOLUME" >/dev/null
          docker run --rm --user "$(id -u):$(id -g)" --network none \
            --env "TRIVY_CACHE_DIR=$ANVA_TRIVY_CACHE_DIR" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=${CACHE_VOLUME},dst=${ANVA_TRIVY_CACHE_DIR}" \
            --entrypoint /bin/sh "$ANVA_TRIVY_IMAGE" -eu -c \
            'umask 077; mkdir "$TRIVY_CACHE_DIR/fanal"; test -w "$TRIVY_CACHE_DIR/fanal"'
          make release-build

      - name: Require two fresh byte-identical OCI builds
        id: oci
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          verifier="$RUNNER_TEMP/verify-release-oci.py"
          git show "${GITHUB_SHA}:scripts/verify_release_oci.py" > "$verifier"
          test -s "$verifier"
          first="$RUNNER_TEMP/anva-first.oci.tar"
          canonical="$RUNNER_TEMP/anva-canonical.oci.tar"
          for pass in first canonical; do
            builder="anva-oci-${GITHUB_RUN_ID}-${pass}"
            output="$RUNNER_TEMP/anva-${pass}.oci.tar"
            docker buildx create --name "$builder" --driver docker-container \
              --driver-opt "image=$ANVA_BUILDKIT_IMAGE" --use
            docker buildx inspect --bootstrap
            ANVA_OCI_OUTPUT="$output" ANVA_OCI_BUILD_FLAGS=--no-cache \
              make release-image-oci
            docker buildx rm "$builder"
          done
          python3 "$verifier" "$first" --output anva-first.oci.json
          python3 "$verifier" "$canonical" --output anva-canonical.oci.json
          cmp "$first" "$canonical"
          cmp anva-first.oci.json anva-canonical.oci.json
          test "$(stat -c %s "$canonical")" -lt 5368709120
          rm "$first"
          rm anva-first.oci.json
          cp "$canonical" anva-canonical.oci.tar
          registry="${COMPOSE_PROJECT}-oci-registry"
          docker run -d --name "$registry" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /var/lib/registry:rw,nosuid,nodev,noexec,size=1g \
            --publish 127.0.0.1::5000 "$ANVA_REGISTRY_IMAGE"
          address="$(docker port "$registry" 5000/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          for _ in {1..20}; do curl -fsS "http://${address}/v2/" >/dev/null && break; sleep 1; done
          docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /var/tmp:rw,nosuid,nodev,noexec,size=256m \
            --mount "type=bind,src=$canonical,dst=/work/image.oci.tar,readonly" \
            "$ANVA_SKOPEO_IMAGE" copy --preserve-digests --dest-tls-verify=false \
            oci-archive:/work/image.oci.tar "docker://${address}/anva:${ANVA_VERSION}"
          docker pull "${address}/anva:${ANVA_VERSION}"
          docker tag "${address}/anva:${ANVA_VERSION}" \
            "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          echo "archive_sha256=$(jq -r .archive_sha256 anva-canonical.oci.json)" >> "$GITHUB_OUTPUT"
          echo "manifest_digest=$(jq -r .manifest_digest anva-canonical.oci.json)" >> "$GITHUB_OUTPUT"

      - name: Run and explicitly validate every candidate scan stage
        env:
          CACHE_VOLUME: anva-release-proposal-${{ github.run_id }}_release-trivy-cache
        run: |
          set -euo pipefail
          classifier="$RUNNER_TEMP/classify-release-source-scan.py"
          runner="$RUNNER_TEMP/run-release-scan-stage.py"
          cache_override="$RUNNER_TEMP/release-cache.override.yaml"
          git show "${GITHUB_SHA}:scripts/classify_release_source_scan.py" > "$classifier"
          git show "${GITHUB_SHA}:scripts/run_release_scan_stage.py" > "$runner"
          git show "${GITHUB_SHA}:compose.release.cache.yaml" > "$cache_override"
          test -s "$classifier" && test -s "$runner" && test -s "$cache_override"
          scanner_version="$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "$ANVA_TRIVY_IMAGE" --version | head -1)"
          test -n "$scanner_version"
          common=(--scanner-image "$ANVA_TRIVY_IMAGE" --scanner-version "$scanner_version"
            --compose-project "$COMPOSE_PROJECT" --compose-file compose.yaml
            --compose-file compose.release.yaml --compose-file "$cache_override")
          classify() {
            local stage="$1" report="$2" log="$3" sanitized="$4" diagnostic="$5" engine="$6"
            python3 "$classifier" --report-kind "$stage" --report "$report" --raw-log "$log" \
              --sanitized-report "$sanitized" --sanitized-log "$log" --diagnostic "$diagnostic" \
              --database-metadata release-risk-db-metadata.json --scanner-image "$ANVA_TRIVY_IMAGE" \
              --scanner-version "$scanner_version" --engine-exit "$engine" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" --source-commit "$ANVA_REVISION" --tag "${{ inputs.tag }}"
          }
          run_stage() {
            local stage="$1" scanners="$2" target="$3" format="$4" output="$5"; shift 5
            local metadata=()
            while test "${1:-}" != --; do
              test "$#" -ge 2
              metadata+=("$1" "$2")
              shift 2
            done
            shift
            local status="release-risk-${stage}-status.json" log="release-risk-${stage}.log"
            set +e
            python3 "$runner" --stage "$stage" --status-output "$status" --log-output "$log" \
              "${common[@]}" --scanner-set "$scanners" --target "$target" --format "$format" \
              --output "$output" "${metadata[@]}" -- docker compose -f compose.yaml -f compose.release.yaml \
              -f "$cache_override" \
              -p "$COMPOSE_PROJECT" --profile release run --rm release-scanner "$@"
            local rc=$?
            set -e
            return "$rc"
          }
          # Each invocation has an explicit engine result before semantic validation.
          run_stage image-vulnerability vuln "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}" json \
            /release/anva-image-vulnerabilities.json -- image --scanners vuln --format json \
            --exit-code 0 --output /release/anva-image-vulnerabilities.json \
            "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          cp release/anva-image-vulnerabilities.json release-risk-image-vulnerability.raw.json
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL \
            --env "TRIVY_CACHE_DIR=$ANVA_TRIVY_CACHE_DIR" --security-opt no-new-privileges \
            --mount "type=volume,src=${CACHE_VOLUME},dst=${ANVA_TRIVY_CACHE_DIR},readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/evidence" --entrypoint /bin/sh \
            "$ANVA_TRIVY_IMAGE" -eu -c 'metadata="$TRIVY_CACHE_DIR/db/metadata.json"; test -s "$metadata"; cp "$metadata" /evidence/release-risk-db-metadata.json'
          classify image-vulnerability release/anva-image-vulnerabilities.json \
            release-risk-image-vulnerability.log release-risk-report.json \
            release-risk-image-vulnerability-diagnostic.json 0
          run_stage spdx "vuln" "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}" spdx-json \
            /release/anva-image.spdx.json -- image --scanners vuln --format spdx-json \
            --output /release/anva-image.spdx.json "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          cp release/anva-image.spdx.json release-risk-image.spdx.raw.json
          classify spdx release/anva-image.spdx.json release-risk-spdx.log \
            release-risk-image.spdx.json release-risk-spdx-diagnostic.json 0
          run_stage cyclonedx "vuln" "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}" cyclonedx \
            /release/anva-image.cyclonedx.json -- image --scanners vuln --format cyclonedx \
            --output /release/anva-image.cyclonedx.json "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          cp release/anva-image.cyclonedx.json release-risk-image.cyclonedx.raw.json
          classify cyclonedx release/anva-image.cyclonedx.json release-risk-cyclonedx.log \
            release-risk-image.cyclonedx.json release-risk-cyclonedx-diagnostic.json 0
          source_raw=release/anva-source-security.raw.json
          trap 'rm -f "$source_raw"' EXIT
          run_stage source vuln,secret,misconfig /workspace json /release/anva-source-security.raw.json \
            --skip-dir /workspace/.git --skip-dir /workspace/.secrets --skip-dir /workspace/secrets \
            --skip-dir /workspace/backups --skip-dir /workspace/release --skip-dir /workspace/.venv \
            --skip-dir /workspace/.pytest_cache --skip-dir /workspace/.mypy_cache \
            --skip-dir /workspace/.ruff_cache --skip-dir /workspace/htmlcov --skip-file /workspace/.env \
            -- filesystem --scanners vuln,secret,misconfig --format json --exit-code 0 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/.secrets --skip-dirs /workspace/secrets \
            --skip-dirs /workspace/backups --skip-dirs /workspace/release --skip-dirs /workspace/.venv \
            --skip-dirs /workspace/.pytest_cache --skip-dirs /workspace/.mypy_cache \
            --skip-dirs /workspace/.ruff_cache --skip-dirs /workspace/htmlcov \
            --skip-files /workspace/.env --output /release/anva-source-security.raw.json /workspace
          classify source "$source_raw" release-risk-source.log release-risk-source-security.json \
            release-risk-source-scan-diagnostic.json 0
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          names = sorted(
              str(path) for path in Path(".").glob("release-risk-*")
              if path.is_file() and path.name != "release-risk-scan-evidence-manifest.json"
          )
          required = {
              "release-risk-report.json", "release-risk-image.spdx.json",
              "release-risk-image.cyclonedx.json", "release-risk-source-security.json",
              "release-risk-db-metadata.json",
          }
          if not required.issubset(names):
              raise SystemExit("successful scan evidence is incomplete")
          evidence = {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names
          }
          manifest = {
              "schema_version": 1,
              "kind": "anva.release-scan-evidence-manifest",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["ANVA_REVISION"],
              "tag": "${{ inputs.tag }}",
              "scanner_image": os.environ["ANVA_TRIVY_IMAGE"],
              "evidence_sha256": evidence,
          }
          Path("release-risk-scan-evidence-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Retain all completed scan diagnostics before cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-scan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-risk-*.json
            release-risk-*.log
            anva-*.oci.json
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve candidate registry digest locally
        id: digest
        run: |
          set -euo pipefail
          digest="${{ steps.oci.outputs.manifest_digest }}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Create canonical exact-candidate risk proposal
        id: proposal
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          OCI_ARCHIVE_SHA256: ${{ steps.oci.outputs.archive_sha256 }}
          OCI_MANIFEST_DIGEST: ${{ steps.oci.outputs.manifest_digest }}
          RISK_EXPIRES_ON: ${{ inputs.risk_expires_on }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import UTC, date, datetime
          from pathlib import Path

          expiry = date.fromisoformat(os.environ["RISK_EXPIRES_ON"])
          today = datetime.now(UTC).date()
          if expiry < today or (expiry - today).days > 30:
              raise SystemExit("risk expiry must be today through 30 days")
          report_path = Path("release-risk-report.json")
          database_metadata_path = Path("release-risk-db-metadata.json")
          report = json.loads(report_path.read_bytes())
          source_report_path = Path("release-risk-source-security.json")
          source_diagnostic_path = Path("release-risk-source-scan-diagnostic.json")
          scan_manifest_path = Path("release-risk-scan-evidence-manifest.json")
          source_report = json.loads(source_report_path.read_bytes())
          source_diagnostic = json.loads(source_diagnostic_path.read_bytes())
          if source_report.get("SchemaVersion") != 2 or not isinstance(
              source_report.get("Results"), list
          ):
              raise SystemExit("validated source security report is malformed")
          if (
              source_diagnostic.get("classification") != "passed"
              or source_diagnostic.get("engine_exit_code") != 0
              or source_diagnostic.get("blocking_findings") != []
          ):
              raise SystemExit("source security scan is not explicitly passing")
          if source_diagnostic.get("sanitized_report_sha256") != hashlib.sha256(
              source_report_path.read_bytes()
          ).hexdigest():
              raise SystemExit("source security report does not match its diagnostic")
          if source_diagnostic.get("database_metadata_sha256") != hashlib.sha256(
              database_metadata_path.read_bytes()
          ).hexdigest():
              raise SystemExit("source scan database metadata does not match")
          tuples = []
          for result in report.get("Results", []):
              for item in result.get("Vulnerabilities") or []:
                  if item.get("Severity") in {"HIGH", "CRITICAL"}:
                      if item.get("FixedVersion") not in {None, ""}:
                          raise SystemExit("HIGH/CRITICAL finding has an available fix")
                      if item.get("Status") not in {"affected", "fix_deferred", "will_not_fix"}:
                          raise SystemExit("HIGH/CRITICAL finding is not in an approvable no-fix state")
                      tuples.append({key: item.get(key) for key in (
                          "VulnerabilityID", "PkgName", "InstalledVersion",
                          "FixedVersion", "Severity", "Status")})
          tuples.sort(key=lambda item: tuple(str(item.get(key) or "") for key in sorted(item)))
          controls = hashlib.sha256(b"".join(
              Path(name).read_bytes() for name in (
                  "Dockerfile", "compose.yaml", "compose.release.yaml",
                  "docs/security/product-threat-model.md")
          )).hexdigest()
          proposal = {
              "schema_version": 1,
              "kind": "anva.release-risk-proposal",
              "version": os.environ["ANVA_VERSION"],
              "tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "image_digest": os.environ["OCI_MANIFEST_DIGEST"],
              "oci_archive_sha256": os.environ["OCI_ARCHIVE_SHA256"],
              "build_input_sha256": os.environ["ANVA_BUILD_INPUT_SHA256"],
              "report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "database_metadata_sha256": hashlib.sha256(
                  database_metadata_path.read_bytes()).hexdigest(),
              "source_security_report_sha256": hashlib.sha256(
                  source_report_path.read_bytes()).hexdigest(),
              "source_scan_diagnostic_sha256": hashlib.sha256(
                  source_diagnostic_path.read_bytes()).hexdigest(),
              "scan_evidence_manifest_sha256": hashlib.sha256(
                  scan_manifest_path.read_bytes()).hexdigest(),
              "runtime_controls_sha256": controls,
              "high_critical_tuples": tuples,
              "decision_expires_on": os.environ["RISK_EXPIRES_ON"],
          }
          data = (json.dumps(proposal, sort_keys=True, separators=(",", ":")) + "\n").encode()
          Path("release-risk-proposal.json").write_bytes(data)
          Path("release-risk-proposal.sha256").write_text(hashlib.sha256(data).hexdigest() + "\n")
          PY
          echo "sha256=$(cat release-risk-proposal.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attest exact-candidate risk proposal
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release-risk-proposal.json
            release-risk-report.json
            release-risk-db-metadata.json
            release-risk-source-security.json
            release-risk-source-scan-diagnostic.json
            release-risk-scan-evidence-manifest.json
            release-risk-image.spdx.json
            release-risk-image.cyclonedx.json
            anva-canonical.oci.tar
            anva-canonical.oci.json

      - name: Upload proposal for personal review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-risk-proposal-${{ github.run_id }}
          path: |
            release-risk-proposal.json
            release-risk-proposal.sha256
            release-risk-report.json
            release-risk-db-metadata.json
            release-risk-source-security.json
            release-risk-source-scan-diagnostic.json
            release-risk-scan-evidence-manifest.json
            release-risk-image.spdx.json
            release-risk-image.cyclonedx.json
            anva-canonical.oci.tar
            anva-canonical.oci.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove only candidate-owned resources
        if: always()
        run: |
          set -euo pipefail
          docker buildx rm "anva-oci-${GITHUB_RUN_ID}-first" \
            "anva-oci-${GITHUB_RUN_ID}-canonical" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/anva-first.oci.tar" "$RUNNER_TEMP/anva-canonical.oci.tar" \
            anva-canonical.oci.tar anva-canonical.oci.json
          rm -f anva-first.oci.json
          registry="${COMPOSE_PROJECT}-registry"
          if docker container inspect "$registry" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "com.anva.release.owner" }}' "$registry")" = "$COMPOSE_PROJECT"
            docker rm -f "$registry"
          fi
          oci_registry="${COMPOSE_PROJECT}-oci-registry"
          if docker container inspect "$oci_registry" >/dev/null 2>&1; then
            docker rm -f "$oci_registry"
          fi
          docker compose -f compose.yaml -f compose.release.yaml -p "$COMPOSE_PROJECT" --profile release down --volumes --remove-orphans || true

  build:
    name: Build and attest
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.image.outputs.reference }}
      tag: ${{ steps.identity.outputs.tag }}
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      COMPOSE_PROJECT: anva-release-build-${{ github.run_id }}
    steps:
      - name: Resolve the exact release tag
        id: identity
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          tag="$DISPATCH_TAG"
          [[ "$EVENT_REF" == "refs/heads/main" ]] || {
            echo "Release dispatch must load the reviewed workflow from main" >&2
            exit 1
          }
          [[ "$tag" == "v${ANVA_VERSION}" ]] || {
            echo "Only v${ANVA_VERSION} may be released by this workflow" >&2
            exit 1
          }
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Release source must be one full lowercase Git commit" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the attested proposal reviewed at the environment gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-risk-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/risk-proposal

      - name: Materialize approval validator from reviewed workflow source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewed_dir="$RUNNER_TEMP/reviewed-workflow"
          validator="$reviewed_dir/validate_release_approvals.py"
          oci_verifier="$reviewed_dir/verify_release_oci.py"
          mkdir -p "$reviewed_dir"
          response="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/validate_release_approvals.py" \
            -f "ref=${GITHUB_SHA}")"
          expected_blob="$(jq -er .sha <<<"$response")"
          jq -er .content <<<"$response" | tr -d '\n' | base64 --decode > "$validator"
          test -s "$validator"
          test "$(git hash-object "$validator")" = "$expected_blob"
          response="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/verify_release_oci.py" \
            -f "ref=${GITHUB_SHA}")"
          expected_blob="$(jq -er .sha <<<"$response")"
          jq -er .content <<<"$response" | tr -d '\n' | base64 --decode > "$oci_verifier"
          test -s "$oci_verifier"
          test "$(git hash-object "$oci_verifier")" = "$expected_blob"
          echo "REVIEWED_APPROVAL_VALIDATOR=$validator" >> "$GITHUB_ENV"
          echo "REVIEWED_OCI_VERIFIER=$oci_verifier" >> "$GITHUB_ENV"

      - name: Verify exact RishavT environment approval and proposal provenance
        id: human-approval
        env:
          EXPECTED_PROPOSAL_SHA256: ${{ needs.candidate.outputs.proposal_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "RishavT"
          actual_proposal_sha256="$(sha256sum "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json" | cut -d' ' -f1)"
          test "$actual_proposal_sha256" = "$EXPECTED_PROPOSAL_SHA256"
          test "$(cat "$RUNNER_TEMP/risk-proposal/release-risk-proposal.sha256")" = "$EXPECTED_PROPOSAL_SHA256"
          for evidence in release-risk-proposal.json release-risk-report.json release-risk-db-metadata.json \
            release-risk-source-security.json release-risk-source-scan-diagnostic.json \
            release-risk-scan-evidence-manifest.json release-risk-image.spdx.json \
            release-risk-image.cyclonedx.json anva-canonical.oci.tar \
            anva-canonical.oci.json; do
            gh attestation verify "$RUNNER_TEMP/risk-proposal/$evidence" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          test "$(sha256sum "$RUNNER_TEMP/risk-proposal/release-risk-report.json" | cut -d' ' -f1)" = \
            "$(jq -r .report_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          test "$(sha256sum "$RUNNER_TEMP/risk-proposal/release-risk-db-metadata.json" | cut -d' ' -f1)" = \
            "$(jq -r .database_metadata_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          test "$(sha256sum "$RUNNER_TEMP/risk-proposal/release-risk-source-security.json" | cut -d' ' -f1)" = \
            "$(jq -r .source_security_report_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          test "$(sha256sum "$RUNNER_TEMP/risk-proposal/release-risk-source-scan-diagnostic.json" | cut -d' ' -f1)" = \
            "$(jq -r .source_scan_diagnostic_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          test "$(sha256sum "$RUNNER_TEMP/risk-proposal/release-risk-scan-evidence-manifest.json" | cut -d' ' -f1)" = \
            "$(jq -r .scan_evidence_manifest_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          test "$(jq -r .classification "$RUNNER_TEMP/risk-proposal/release-risk-source-scan-diagnostic.json")" = passed
          python3 "$REVIEWED_OCI_VERIFIER" \
            "$RUNNER_TEMP/risk-proposal/anva-canonical.oci.tar" \
            --output "$RUNNER_TEMP/protected-oci.json"
          test "$(jq -r .archive_sha256 "$RUNNER_TEMP/protected-oci.json")" = \
            "$(jq -r .oci_archive_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          test "$(jq -r .manifest_digest "$RUNNER_TEMP/protected-oci.json")" = \
            "$(jq -r .image_digest "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          cmp "$RUNNER_TEMP/protected-oci.json" \
            "$RUNNER_TEMP/risk-proposal/anva-canonical.oci.json"
          approvals="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")"
          approval_sha256="$(python3 "$REVIEWED_APPROVAL_VALIDATOR" \
            --require-single <<<"$approvals")"
          echo "record=$approval_sha256" >> "$GITHUB_OUTPUT"
          echo "proposal=$actual_proposal_sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare the run-owned scanner cache
        run: |
          set -euo pipefail
          cache_volume="${COMPOSE_PROJECT}_release-trivy-cache"
          if docker volume inspect "$cache_volume" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing release cache volume: $cache_volume" >&2
            exit 1
          fi
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          created_volume="$(docker volume create \
            --label "com.docker.compose.project=$COMPOSE_PROJECT" \
            --label "com.docker.compose.volume=release-trivy-cache" \
            "$cache_volume")"
          test "$created_volume" = "$cache_volume"
          test "$(docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$cache_volume")" = "$COMPOSE_PROJECT"
          test "$(docker volume inspect --format '{{ index .Labels "com.docker.compose.volume" }}' "$cache_volume")" = "release-trivy-cache"
          docker run --rm \
            --user "$runner_uid:$runner_gid" \
            --env "EXPECTED_UID=$runner_uid" \
            --env "EXPECTED_GID=$runner_gid" \
            --env "TRIVY_CACHE_DIR=$ANVA_TRIVY_CACHE_DIR" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --network none \
            --mount "type=volume,src=${cache_volume},dst=${ANVA_TRIVY_CACHE_DIR}" \
            --entrypoint /bin/sh \
            "$ANVA_TRIVY_IMAGE" -eu -c '
              test "$(id -u)" = "$EXPECTED_UID"
              test "$(id -g)" = "$EXPECTED_GID"
              umask 077
              mkdir "$TRIVY_CACHE_DIR/fanal"
              test -w "$TRIVY_CACHE_DIR/fanal"
              test "$(stat -c "%u:%g" "$TRIVY_CACHE_DIR/fanal")" = "$EXPECTED_UID:$EXPECTED_GID"
            '

      - name: Check out the exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.tag }}

      - name: Verify tag, version, commit, and clean source
        id: source
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled=$1 }
            $2 !~ /\^\{\}$/ { direct=$1 }
            END { print peeled ? peeled : direct }
          ')"
          test -n "$remote_commit"
          test "$checkout_commit" = "$source_commit"
          test "$remote_commit" = "$source_commit"
          test "$source_commit" = "$EXPECTED_SOURCE_COMMIT"
          git merge-base --is-ancestor "$source_commit" origin/main
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$ANVA_VERSION"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          [[ "$docker_gid" =~ ^[0-9]+$ ]] || {
            echo "Docker socket group ID must be numeric" >&2
            exit 1
          }
          {
            echo "ANVA_REVISION=$source_commit"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$source_commit")"
            echo "ANVA_BUILD_INPUT_SHA256=$(git archive --format=tar "$source_commit" | sha256sum | cut -d' ' -f1)"
            echo "ANVA_HOST_UID=$(id -u)"
            echo "ANVA_HOST_GID=$(id -g)"
            echo "ANVA_DOCKER_GID=$docker_gid"
          } >> "$GITHUB_ENV"

      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and fail-closed verify release artifacts
        run: |
          set -euo pipefail
          cache_override="$RUNNER_TEMP/release-cache.override.yaml"
          git show "${GITHUB_SHA}:compose.release.cache.yaml" > "$cache_override"
          test -s "$cache_override"
          test "$(jq -r .build_input_sha256 "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")" = \
            "$ANVA_BUILD_INPUT_SHA256"
          make release-package-files
          registry="${COMPOSE_PROJECT}-scan-registry"
          docker run -d --name "$registry" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /var/lib/registry:rw,nosuid,nodev,noexec,size=1g \
            --publish 127.0.0.1::5000 "$ANVA_REGISTRY_IMAGE"
          address="$(docker port "$registry" 5000/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          for _ in {1..20}; do curl -fsS "http://${address}/v2/" >/dev/null && break; sleep 1; done
          docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /var/tmp:rw,nosuid,nodev,noexec,size=256m \
            --mount "type=bind,src=$RUNNER_TEMP/risk-proposal/anva-canonical.oci.tar,dst=/work/image.oci.tar,readonly" \
            "$ANVA_SKOPEO_IMAGE" copy --preserve-digests --dest-tls-verify=false \
            oci-archive:/work/image.oci.tar "docker://${address}/anva:${ANVA_VERSION}"
          expected="$(jq -r .image_digest "$RUNNER_TEMP/risk-proposal/release-risk-proposal.json")"
          actual="$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "http://${address}/v2/anva/manifests/${ANVA_VERSION}" | \
            sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: \([^[:space:]\r]*\).*/\1/p')"
          test "$actual" = "$expected"
          docker pull "${address}/anva:${ANVA_VERSION}"
          docker tag "${address}/anva:${ANVA_VERSION}" "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          make RELEASE_COMPOSE="docker compose -p $COMPOSE_PROJECT -f compose.yaml -f compose.release.yaml -f $cache_override" release-scan
          docker rm -f "$registry"

      - name: Create the immutable product source binding
        id: source-binding
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          predicate="$RUNNER_TEMP/anva-source-binding.json"
          PREDICATE_PATH="$predicate" python3 - <<'PY'
          import json
          import os

          predicate = {
              "schemaVersion": 1,
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceRef": f"refs/tags/{os.environ['RELEASE_TAG']}",
              "sourceRepository": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "sourceTag": os.environ["RELEASE_TAG"],
              "version": os.environ["ANVA_VERSION"],
          }
          with open(os.environ["PREDICATE_PATH"], "w", encoding="utf-8") as output:
              json.dump(predicate, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY
          echo "predicate=$predicate" >> "$GITHUB_OUTPUT"

      - name: Prepare the run-owned local digest registry
        id: local-registry
        run: |
          set -euo pipefail
          registry_container="${COMPOSE_PROJECT}-digest-registry"
          if docker container inspect "$registry_container" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing digest registry: $registry_container" >&2
            exit 1
          fi
          docker run --detach \
            --name "$registry_container" \
            --label "com.anva.release.owner=$COMPOSE_PROJECT" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /var/lib/registry:rw,nosuid,nodev,noexec,size=1g \
            --publish 127.0.0.1::5000 \
            "$ANVA_REGISTRY_IMAGE"
          test "$(docker inspect --format '{{ index .Config.Labels "com.anva.release.owner" }}' "$registry_container")" = "$COMPOSE_PROJECT"
          registry_address="$(docker port "$registry_container" 5000/tcp)"
          [[ "$registry_address" =~ ^127\.0\.0\.1:[0-9]+$ ]] || {
            echo "Digest registry must bind only to a loopback TCP port" >&2
            exit 1
          }
          ready=false
          for _ in {1..20}; do
            if curl --fail --silent "http://${registry_address}/v2/" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          echo "endpoint=$registry_address" >> "$GITHUB_OUTPUT"

      - name: Resolve the exact image digest without remote publication
        id: image
        env:
          LOCAL_REGISTRY: ${{ steps.local-registry.outputs.endpoint }}
        run: |
          set -euo pipefail
          [[ "$LOCAL_REGISTRY" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /var/tmp:rw,nosuid,nodev,noexec,size=256m \
            --mount "type=bind,src=$RUNNER_TEMP/risk-proposal/anva-canonical.oci.tar,dst=/work/image.oci.tar,readonly" \
            "$ANVA_SKOPEO_IMAGE" copy --preserve-digests --dest-tls-verify=false \
            oci-archive:/work/image.oci.tar "docker://${LOCAL_REGISTRY}/anva:${ANVA_VERSION}"
          digest="$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "http://${LOCAL_REGISTRY}/v2/anva/manifests/${ANVA_VERSION}" | \
            sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: \([^[:space:]\r]*\).*/\1/p')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Local digest registry did not return an immutable digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=${ANVA_IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Bind approved residual risk to the immutable image
        env:
          APPROVAL_RECORD_SHA256: ${{ steps.human-approval.outputs.record }}
          APPROVED_PROPOSAL_SHA256: ${{ steps.human-approval.outputs.proposal }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          PROPOSAL="$RUNNER_TEMP/risk-proposal/release-risk-proposal.json" \
          REPORT=release/anva-image-vulnerabilities.json \
          DECISION="$RUNNER_TEMP/vulnerability-risk-acceptance.json" \
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import UTC, date, datetime
          from pathlib import Path

          proposal_path = Path(os.environ["PROPOSAL"])
          proposal_bytes = proposal_path.read_bytes()
          proposal = json.loads(proposal_bytes)
          report_path = Path(os.environ["REPORT"])
          report = json.loads(report_path.read_bytes())
          tuples = []
          for result in report.get("Results", []):
              for item in result.get("Vulnerabilities") or []:
                  if item.get("Severity") in {"HIGH", "CRITICAL"}:
                      if item.get("FixedVersion") not in {None, ""}:
                          raise SystemExit("HIGH/CRITICAL finding has an available fix")
                      if item.get("Status") not in {"affected", "fix_deferred", "will_not_fix"}:
                          raise SystemExit("HIGH/CRITICAL finding is not in an approvable no-fix state")
                      tuples.append({key: item.get(key) for key in (
                          "VulnerabilityID", "PkgName", "InstalledVersion",
                          "FixedVersion", "Severity", "Status")})
          tuples.sort(key=lambda item: tuple(str(item.get(key) or "") for key in sorted(item)))
          controls = hashlib.sha256(b"".join(
              Path(name).read_bytes() for name in (
                  "Dockerfile", "compose.yaml", "compose.release.yaml",
                  "docs/security/product-threat-model.md")
          )).hexdigest()
          expected = {
              "version": os.environ["ANVA_VERSION"],
              "source_commit": os.environ["ANVA_REVISION"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "build_input_sha256": os.environ["ANVA_BUILD_INPUT_SHA256"],
              "runtime_controls_sha256": controls,
              "high_critical_tuples": tuples,
          }
          if any(proposal.get(key) != value for key, value in expected.items()):
              raise SystemExit("rebuilt candidate does not match the approved exact proposal")
          proposal_sha = hashlib.sha256(proposal_bytes).hexdigest()
          if proposal_sha != os.environ["APPROVED_PROPOSAL_SHA256"]:
              raise SystemExit("approved proposal checksum changed")
          expiry = date.fromisoformat(proposal["decision_expires_on"])
          today = datetime.now(UTC).date()
          if expiry < today or (expiry - today).days > 30:
              raise SystemExit("risk approval expired")
          decision = {
              "schema_version": 1,
              "kind": "anva.release-risk-decision",
              "decision": "accepted_for_exact_candidate",
              "approved_by": "RishavT",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_environment": "release",
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "environment_approval_record_sha256": os.environ["APPROVAL_RECORD_SHA256"],
              "proposal_sha256": proposal_sha,
              "proposal_report_sha256": proposal["report_sha256"],
              "proposal_database_metadata_sha256": proposal["database_metadata_sha256"],
              "proposal_source_security_report_sha256": proposal[
                  "source_security_report_sha256"],
              "proposal_source_scan_diagnostic_sha256": proposal[
                  "source_scan_diagnostic_sha256"],
              "proposal_scan_evidence_manifest_sha256": proposal[
                  "scan_evidence_manifest_sha256"],
              "verification_report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "image_reference": os.environ["IMAGE_REFERENCE"],
              **expected,
              "expires_on": proposal["decision_expires_on"],
          }
          Path(os.environ["DECISION"]).write_text(
              json.dumps(decision, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          ANVA_RELEASE_IMAGE_REFERENCE="$IMAGE_REFERENCE" \
          ANVA_RELEASE_IMAGE_ID="$IMAGE_DIGEST" \
          ANVA_GITHUB_RUN_ID="$GITHUB_RUN_ID" \
          ANVA_PROPOSAL_SHA256="$APPROVED_PROPOSAL_SHA256" \
          ANVA_APPROVAL_RECORD_SHA256="$APPROVAL_RECORD_SHA256" \
          ANVA_WORKFLOW_REPOSITORY="$GITHUB_REPOSITORY" \
          ANVA_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
          ANVA_RELEASE_RISK_DECISION_INPUT="$RUNNER_TEMP/vulnerability-risk-acceptance.json" \
          RELEASE_COMPOSE="docker compose -f compose.yaml -f compose.release.yaml -p $COMPOSE_PROJECT -f $RUNNER_TEMP/release-cache.override.yaml" \
            make release-scan-gate
          rm -f release/.trivyignore
          ANVA_RELEASE_IMAGE_REFERENCE="$IMAGE_REFERENCE" \
            ANVA_RELEASE_IMAGE_ID="$IMAGE_DIGEST" make release-manifest
          (cd release && sha256sum --check SHA256SUMS)

      - name: Attest the exact human risk decision before publication
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/vulnerability-risk-acceptance.json

      - name: Verify the human decision attestation before publication
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify release/vulnerability-risk-acceptance.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          jq -e --arg proposal "${{ steps.human-approval.outputs.proposal }}" '
            .kind == "anva.release-risk-decision" and
            .decision == "accepted_for_exact_candidate" and
            .approved_by == "RishavT" and
            .github_run_id == env.GITHUB_RUN_ID and
            .github_environment == "release" and
            .image_reference == (env.ANVA_IMAGE_REPOSITORY + "@" + env.IMAGE_DIGEST) and
            .proposal_sha256 == $proposal
          ' release/vulnerability-risk-acceptance.json >/dev/null

      - name: Publish the exact version image after local release gates
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          direct="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }')"
          peeled="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1 }')"
          test "$(printf '%s\n' "$direct" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$peeled" | sed '/^$/d' | wc -l)" -le 1
          remote_commit="${peeled:-$direct}"
          [[ "$remote_commit" =~ ^[a-f0-9]{40}$ ]]
          test "$remote_commit" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          auth_dir="$RUNNER_TEMP/skopeo-auth"
          trap 'rm -f "$auth_dir/auth.json"; rmdir "$auth_dir" 2>/dev/null || true' EXIT
          mkdir -m 700 "$auth_dir"
          AUTH_FILE="$auth_dir/auth.json" python3 - <<'PY'
          import base64, json, os
          auth = base64.b64encode(
              f"{os.environ['GITHUB_ACTOR']}:{os.environ['GHCR_TOKEN']}".encode()
          ).decode()
          with open(os.environ["AUTH_FILE"], "w", encoding="utf-8") as output:
              json.dump({"auths": {"ghcr.io": {"auth": auth}}}, output)
          os.chmod(os.environ["AUTH_FILE"], 0o600)
          PY
          docker run --rm --network bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /var/tmp:rw,nosuid,nodev,noexec,size=256m \
            --mount "type=bind,src=$RUNNER_TEMP/risk-proposal/anva-canonical.oci.tar,dst=/work/image.oci.tar,readonly" \
            --mount "type=bind,src=$auth_dir/auth.json,dst=/run/containers/auth.json,readonly" \
            "$ANVA_SKOPEO_IMAGE" copy --preserve-digests \
            --authfile /run/containers/auth.json oci-archive:/work/image.oci.tar \
            "docker://${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          published_digest="$(docker run --rm --network bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$auth_dir/auth.json,dst=/run/containers/auth.json,readonly" \
            "$ANVA_SKOPEO_IMAGE" inspect --authfile /run/containers/auth.json --format '{{.Digest}}' \
            "docker://${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}")"
          [[ "$published_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Registry did not return an immutable version digest" >&2
            exit 1
          }
          test "$published_digest" = "$IMAGE_DIGEST"
          rm -f "$auth_dir/auth.json"
          rmdir "$auth_dir"
          trap - EXIT

      - name: Attest the GHCR image
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.ANVA_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest every downloadable release artifact
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*

      - name: Attest the image digest to the immutable product source
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ANVA_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: ${{ env.ANVA_SOURCE_PREDICATE_TYPE }}
          predicate-path: ${{ steps.source-binding.outputs.predicate }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest artifact digests to the immutable product source
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
          predicate-type: ${{ env.ANVA_SOURCE_PREDICATE_TYPE }}
          predicate-path: ${{ steps.source-binding.outputs.predicate }}

      - name: Transfer only the attested release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.run_id }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove only build-owned resources
        if: always()
        run: |
          set -euo pipefail
          scan_registry="${COMPOSE_PROJECT}-scan-registry"
          if docker container inspect "$scan_registry" >/dev/null 2>&1; then
            docker rm --force "$scan_registry"
          fi
          registry_container="${COMPOSE_PROJECT}-digest-registry"
          if docker container inspect "$registry_container" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{ index .Config.Labels "com.anva.release.owner" }}' "$registry_container")" = "$COMPOSE_PROJECT"
            docker rm --force "$registry_container"
          fi
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          [[ "$docker_gid" =~ ^[0-9]+$ ]] || {
            echo "Docker socket group ID must be numeric" >&2
            exit 1
          }
          export ANVA_DOCKER_GID="$docker_gid"
          cache_volume="${COMPOSE_PROJECT}_release-trivy-cache"
          validate_cache_volume() {
            project_label="$(docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$cache_volume")"
            volume_label="$(docker volume inspect --format '{{ index .Labels "com.docker.compose.volume" }}' "$cache_volume")"
            test "$project_label" = "$COMPOSE_PROJECT"
            test "$volume_label" = "release-trivy-cache"
          }
          if docker volume inspect "$cache_volume" >/dev/null 2>&1; then
            validate_cache_volume
          fi
          docker compose -f compose.yaml -f compose.release.yaml -p "$COMPOSE_PROJECT" --profile release down --volumes --remove-orphans || true
          if docker volume inspect "$cache_volume" >/dev/null 2>&1; then
            validate_cache_volume
            docker volume rm "$cache_volume"
          fi
          docker logout ghcr.io || true

  publish:
    name: Create GitHub Release
    needs: [candidate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: read
    steps:
      - name: Materialize approval validator from reviewed workflow source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewed_dir="$RUNNER_TEMP/reviewed-workflow"
          validator="$reviewed_dir/validate_release_approvals.py"
          mkdir -p "$reviewed_dir"
          response="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/validate_release_approvals.py" \
            -f "ref=${GITHUB_SHA}")"
          expected_blob="$(jq -er .sha <<<"$response")"
          jq -er .content <<<"$response" | tr -d '\n' | base64 --decode > "$validator"
          test -s "$validator"
          test "$(git hash-object "$validator")" = "$expected_blob"
          echo "REVIEWED_APPROVAL_VALIDATOR=$validator" >> "$GITHUB_ENV"

      - name: Check out the verified source commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_commit }}

      - name: Recheck immutable release identity
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled=$1 }
            $2 !~ /\^\{\}$/ { direct=$1 }
            END { print peeled ? peeled : direct }
          ')"
          test -n "$remote_commit"
          test "$remote_commit" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Download attested release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ github.run_id }}
          path: release

      - name: Download original candidate risk evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-risk-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/risk-proposal

      - name: Verify transferred checksums
        run: (cd release && sha256sum --check SHA256SUMS)

      - name: Authenticate to GHCR for source-binding verification
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify immutable product source bindings
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          published="$GITHUB_WORKSPACE/release"
          verify_source_binding() {
            subject="$1"
            verification="$(gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$ANVA_SOURCE_PREDICATE_TYPE" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --format json)"
            jq -e \
              --arg type "$ANVA_SOURCE_PREDICATE_TYPE" \
              --arg commit "$SOURCE_COMMIT" \
              --arg ref "refs/tags/$RELEASE_TAG" \
              --arg repository "https://github.com/$GITHUB_REPOSITORY" \
              --arg tag "$RELEASE_TAG" \
              --arg version "$ANVA_VERSION" \
              'any(.[];
                .verificationResult.statement.predicateType == $type and
                .verificationResult.statement.predicate["sourceCommit"] == $commit and
                .verificationResult.statement.predicate["sourceRef"] == $ref and
                .verificationResult.statement.predicate["sourceRepository"] == $repository and
                .verificationResult.statement.predicate["sourceTag"] == $tag and
                .verificationResult.statement.predicate["version"] == $version
              )' <<<"$verification" >/dev/null
          }
          for artifact in "$published"/*; do
            verify_source_binding "$artifact"
          done
          verify_source_binding "oci://${ANVA_IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Create the GitHub Release after attestations
        env:
          EXPECTED_PROPOSAL_SHA256: ${{ needs.candidate.outputs.proposal_sha256 }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          # RELEASE_TAG is assigned by the step environment.
          # shellcheck disable=SC2153
          set -euo pipefail
          decision=release/vulnerability-risk-acceptance.json
          proposal="$RUNNER_TEMP/risk-proposal/release-risk-proposal.json"
          gh attestation verify "$decision" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for evidence in release-risk-proposal.json release-risk-report.json release-risk-db-metadata.json \
            release-risk-source-security.json release-risk-source-scan-diagnostic.json \
            release-risk-scan-evidence-manifest.json release-risk-image.spdx.json \
            release-risk-image.cyclonedx.json; do
            gh attestation verify "$RUNNER_TEMP/risk-proposal/$evidence" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          approvals="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")"
          APPROVAL_RECORD_SHA256="$(jq -er .environment_approval_record_sha256 "$decision")"
          python3 "$REVIEWED_APPROVAL_VALIDATOR" \
            --expected-sha256 "$APPROVAL_RECORD_SHA256" <<<"$approvals"
          export APPROVAL_RECORD_SHA256
          export DECISION_PATH="$decision" PROPOSAL_PATH="$proposal"
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import UTC, date, datetime
          from pathlib import Path

          decision = json.loads(Path(os.environ["DECISION_PATH"]).read_bytes())
          proposal_path = Path(os.environ["PROPOSAL_PATH"])
          proposal_bytes = proposal_path.read_bytes()
          proposal = json.loads(proposal_bytes)
          proposal_sha = hashlib.sha256(proposal_bytes).hexdigest()
          report = Path("release/anva-image-vulnerabilities.json").read_bytes()
          original_report = Path(os.environ["RUNNER_TEMP"] + "/risk-proposal/release-risk-report.json").read_bytes()
          database_metadata = Path(os.environ["RUNNER_TEMP"] + "/risk-proposal/release-risk-db-metadata.json").read_bytes()
          source_security = Path(os.environ["RUNNER_TEMP"] + "/risk-proposal/release-risk-source-security.json").read_bytes()
          source_diagnostic = Path(os.environ["RUNNER_TEMP"] + "/risk-proposal/release-risk-source-scan-diagnostic.json").read_bytes()
          scan_manifest = Path(os.environ["RUNNER_TEMP"] + "/risk-proposal/release-risk-scan-evidence-manifest.json").read_bytes()
          controls = hashlib.sha256(b"".join(
              Path(name).read_bytes() for name in (
                  "Dockerfile", "compose.yaml", "compose.release.yaml",
                  "docs/security/product-threat-model.md")
          )).hexdigest()
          expected = {
              "kind": "anva.release-risk-decision",
              "decision": "accepted_for_exact_candidate",
              "approved_by": "RishavT",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_environment": "release",
              "environment_approval_record_sha256": os.environ["APPROVAL_RECORD_SHA256"],
              "proposal_sha256": proposal_sha,
              "proposal_report_sha256": hashlib.sha256(original_report).hexdigest(),
              "proposal_database_metadata_sha256": hashlib.sha256(database_metadata).hexdigest(),
              "proposal_source_security_report_sha256": hashlib.sha256(source_security).hexdigest(),
              "proposal_source_scan_diagnostic_sha256": hashlib.sha256(source_diagnostic).hexdigest(),
              "proposal_scan_evidence_manifest_sha256": hashlib.sha256(scan_manifest).hexdigest(),
              "verification_report_sha256": hashlib.sha256(report).hexdigest(),
              "version": os.environ["ANVA_VERSION"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "image_reference": f"{os.environ['ANVA_IMAGE_REPOSITORY']}@{os.environ['IMAGE_DIGEST']}",
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "runtime_controls_sha256": controls,
              "high_critical_tuples": proposal["high_critical_tuples"],
          }
          if proposal_sha != os.environ["EXPECTED_PROPOSAL_SHA256"]:
              raise SystemExit("release proposal checksum differs from the approved run output")
          if proposal.get("tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("release proposal tag changed")
          if proposal.get("report_sha256") != expected["proposal_report_sha256"]:
              raise SystemExit("original candidate report bytes changed")
          if proposal.get("database_metadata_sha256") != expected["proposal_database_metadata_sha256"]:
              raise SystemExit("original Trivy database metadata changed")
          if proposal.get("source_security_report_sha256") != expected["proposal_source_security_report_sha256"]:
              raise SystemExit("validated source security report changed")
          if proposal.get("source_scan_diagnostic_sha256") != expected["proposal_source_scan_diagnostic_sha256"]:
              raise SystemExit("source scan diagnostic changed")
          if proposal.get("scan_evidence_manifest_sha256") != expected["proposal_scan_evidence_manifest_sha256"]:
              raise SystemExit("scan evidence manifest changed")
          if json.loads(source_diagnostic).get("classification") != "passed":
              raise SystemExit("source scan diagnostic is not passing")
          if any(decision.get(key) != value for key, value in expected.items()):
              raise SystemExit("risk decision binding is incomplete or stale")
          expiry = date.fromisoformat(str(decision.get("expires_on")))
          today = datetime.now(UTC).date()
          if expiry < today or (expiry - today).days > 30:
              raise SystemExit("risk decision is expired or exceeds 30 days")
          PY
          resolve_remote_tag() {
            tag="$1"
            remote_refs="$(git ls-remote --exit-code origin \
              "refs/tags/${tag}" "refs/tags/${tag}^{}")" || return 1
            direct_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${tag}" '$2 == ref { print $1 }')" || return 1
            peeled_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/${tag}^{}" '$2 == ref { print $1 }')" || return 1
            direct_count="$(printf '%s\n' "$direct_commit" | sed '/^$/d' | wc -l)" || return 1
            peeled_count="$(printf '%s\n' "$peeled_commit" | sed '/^$/d' | wc -l)" || return 1
            test "$direct_count" -eq 1 || return 1
            test "$peeled_count" -le 1 || return 1
            remote_commit="${peeled_commit:-$direct_commit}"
            [[ "$remote_commit" =~ ^[a-f0-9]{40}$ ]] || return 1
            printf '%s\n' "$remote_commit" || return 1
          }

          # This check is intentionally adjacent to the release mutation. The
          # earlier identity gate cannot protect against a tag race while the
          # assets and attestations are being verified.
          remote_commit="$(resolve_remote_tag "$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$remote_commit" = "$SOURCE_COMMIT"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing immutable release" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Anva ${ANVA_VERSION}" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag

          published_release_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq .tag_name)"
          test "$published_release_tag" = "$RELEASE_TAG"
          release_commit="$(resolve_remote_tag "$published_release_tag")"
          test "$release_commit" = "$SOURCE_COMMIT"

      - name: Remove publish authentication
        if: always()
        run: docker logout ghcr.io || true

  verify:
    name: Verify published release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: read
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT: anva-release-verify-${{ github.run_id }}
    steps:
      - name: Check out the verified source commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_commit }}

      - name: Recheck immutable release identity
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled=$1 }
            $2 !~ /\^\{\}$/ { direct=$1 }
            END { print peeled ? peeled : direct }
          ')"
          test -n "$remote_commit"
          test "$remote_commit" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify immutable product source bindings
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          published="$(mktemp -d)"
          echo "PUBLISHED_DIR=$published" >> "$GITHUB_ENV"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$published"
          (cd "$published" && sha256sum --check SHA256SUMS)
          verify_source_binding() {
            subject="$1"
            verification="$(gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$ANVA_SOURCE_PREDICATE_TYPE" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --format json)"
            jq -e \
              --arg type "$ANVA_SOURCE_PREDICATE_TYPE" \
              --arg commit "$SOURCE_COMMIT" \
              --arg ref "refs/tags/$RELEASE_TAG" \
              --arg repository "https://github.com/$GITHUB_REPOSITORY" \
              --arg tag "$RELEASE_TAG" \
              --arg version "$ANVA_VERSION" \
              'any(.[];
                .verificationResult.statement.predicateType == $type and
                .verificationResult.statement.predicate["sourceCommit"] == $commit and
                .verificationResult.statement.predicate["sourceRef"] == $ref and
                .verificationResult.statement.predicate["sourceRepository"] == $repository and
                .verificationResult.statement.predicate["sourceTag"] == $tag and
                .verificationResult.statement.predicate["version"] == $version
              )' <<<"$verification" >/dev/null
          }
          for artifact in "$published"/*; do
            verify_source_binding "$artifact"
          done
          verify_source_binding "oci://${ANVA_IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Verify published digest, attestations, and install lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          published="$PUBLISHED_DIR"
          (cd "$published" && sha256sum --check SHA256SUMS)
          for artifact in "$published"/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
          install_root="$published/install"
          mkdir "$install_root"
          INSTALL_ARCHIVE="$published/anva-install-${ANVA_VERSION}.tar.gz" \
            INSTALL_ROOT="$install_root" python3 - <<'PY'
          import os
          import tarfile

          with tarfile.open(os.environ["INSTALL_ARCHIVE"], "r:gz") as archive:
              archive.extractall(os.environ["INSTALL_ROOT"], filter="data")
          PY
          test -f "$install_root/anva-${ANVA_VERSION}/compose.yaml"
          docker compose -f "$install_root/anva-${ANVA_VERSION}/compose.yaml" config --quiet
          image="${ANVA_IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          gh attestation verify "oci://${image}" --repo "$GITHUB_REPOSITORY"
          docker pull "$image"
          docker tag "$image" "${ANVA_IMAGE_REPOSITORY}:${ANVA_VERSION}"
          docker run --rm --entrypoint anva "$image" --help >/dev/null
          docker compose -p "$COMPOSE_PROJECT" up --no-build --wait
          docker compose -p "$COMPOSE_PROJECT" --profile demo run --rm --no-deps demo >/dev/null

      - name: Remove only verification-owned resources
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT" --profile demo --profile github --profile operations down --volumes --remove-orphans || true
          if [[ -n "${PUBLISHED_DIR:-}" && "$PUBLISHED_DIR" == /tmp/* ]]; then rm -rf "$PUBLISHED_DIR"; fi
          docker logout ghcr.io || true
