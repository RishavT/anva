name: Operator drill signoff anchor

on:
  workflow_dispatch:
    inputs:
      drill_id:
        description: Exact operator drill UUID
        required: true
        type: string
      ledger_sha256:
        description: SHA-256 of the complete pre-anchor JSONL ledger
        required: true
        type: string
      tail_hash:
        description: Exact final pre-anchor event hash
        required: true
        type: string
      product_source_commit:
        description: Exact product source commit
        required: true
        type: string
      operator_source_commit:
        description: Exact operator CLI source commit
        required: true
        type: string
      decision_code_hash:
        description: SHA-256 of canonical ordered decision codes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operator-drill-signoff-${{ inputs.drill_id }}
  cancel-in-progress: false

jobs:
  anchor:
    name: Protected owner signoff anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Validate exact dispatch identities and emit anchor
        id: anchor
        env:
          DECISION_CODE_HASH: ${{ inputs.decision_code_hash }}
          DRILL_ID: ${{ inputs.drill_id }}
          LEDGER_SHA256: ${{ inputs.ledger_sha256 }}
          OPERATOR_SOURCE_COMMIT: ${{ inputs.operator_source_commit }}
          PRODUCT_SOURCE_COMMIT: ${{ inputs.product_source_commit }}
          TAIL_HASH: ${{ inputs.tail_hash }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$DRILL_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          for value in "$LEDGER_SHA256" "$TAIL_HASH" "$DECISION_CODE_HASH"; do
            [[ "$value" =~ ^[a-f0-9]{64}$ ]]
          done
          for value in "$PRODUCT_SOURCE_COMMIT" "$OPERATOR_SOURCE_COMMIT"; do
            [[ "$value" =~ ^[a-f0-9]{40}$ ]]
          done
          python3 - <<'PY'
          import json, os
          anchor = {
              "decision_code_hash": os.environ["DECISION_CODE_HASH"],
              "drill_id": os.environ["DRILL_ID"],
              "ledger_sha256": os.environ["LEDGER_SHA256"],
              "operator_source_commit": os.environ["OPERATOR_SOURCE_COMMIT"],
              "product_source_commit": os.environ["PRODUCT_SOURCE_COMMIT"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "tail_hash": os.environ["TAIL_HASH"],
          }
          with open("operator-drill-anchor.json", "x", encoding="utf-8") as handle:
              json.dump(anchor, handle, separators=(",", ":"), sort_keys=True)
              handle.write("\n")
          with open("operator-drill-predicate.json", "x", encoding="utf-8") as handle:
              json.dump({"anchor": anchor, "environment": "release"}, handle, separators=(",", ":"), sort_keys=True)
              handle.write("\n")
          PY

      - name: Create standard GitHub provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: operator-drill-anchor.json

      - name: Create operator drill predicate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: operator-drill-anchor.json
          predicate-type: https://github.com/RishavT/anva/attestations/operator-drill-signoff/v1
          predicate-path: operator-drill-predicate.json

      - name: Upload immutable anchor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-drill-anchor-${{ inputs.drill_id }}-${{ github.run_id }}
          path: operator-drill-anchor.json
          if-no-files-found: error
          retention-days: 90
