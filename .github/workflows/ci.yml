name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run the same checks as local development
        run: ANVA_HOST_UID="$(id -u)" ANVA_HOST_GID="$(id -g)" make ci
      - name: Retain Canvas performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-performance-${{ github.run_id }}
          path: |
            docs/evidence/issue-012/performance/browser.json
            docs/evidence/issue-012/screenshots/05-canvas-300-node-performance.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Compose diagnostics on failure
        if: failure()
        run: docker compose -p anva-tests --profile test logs --no-color
      - name: Remove test resources
        if: always()
        run: make test-down
