name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify pinned Skopeo auth mount identity
        run: tests/release/test_skopeo_auth_mount.sh
      - name: Run the same checks as local development
        run: |
          test ! -e .ci-artifacts
          mkdir .ci-artifacts
          ANVA_HOST_UID="$(id -u)" \
          ANVA_HOST_GID="$(id -g)" \
          ANVA_CANVAS_PERFORMANCE_ROOT=/workspace/.ci-artifacts/performance \
          ANVA_CANVAS_SCREENSHOT_ROOT=/workspace/.ci-artifacts/screenshots \
          make ci
      - name: Verify acceptance UID permissions on protected binds
        run: |
          docker compose -f compose.yaml -f compose.acceptance.yaml build acceptance-product-start
          compose_plugin="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          socket_gid="$(stat -c %g /var/run/docker.sock)"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$socket_gid" \
            --memory 2g \
            --cpus 2 \
            --env ANVA_IMAGE_REPOSITORY=anva \
            --env ANVA_VERSION=0.1.6 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /usr/bin/docker:/usr/bin/docker:ro \
            --volume "$compose_plugin":/usr/lib/docker/cli-plugins/docker-compose:ro \
            --volume "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            anva-tests-test:latest \
            pytest \
              --basetemp "$GITHUB_WORKSPACE/.ci-artifacts/acceptance-permissions-${GITHUB_RUN_ID}" \
              -q tests/integration/test_acceptance_uid_permissions.py
      - name: Retain Canvas performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-performance-${{ github.run_id }}
          path: |
            .ci-artifacts/performance/browser.json
            .ci-artifacts/screenshots/05-canvas-300-node-performance.png
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Compose diagnostics on failure
        if: failure()
        run: docker compose -p anva-tests --profile test logs --no-color
      - name: Remove test resources
        if: always()
        run: make test-down
