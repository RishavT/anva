name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run the same checks as local development
        run: make ci
      - name: Preserve Compose diagnostics on failure
        if: failure()
        run: docker compose -p anva-tests --profile test logs --no-color
      - name: Remove test resources
        if: always()
        run: make test-down
