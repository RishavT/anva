{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Anva — connective intelligence for how organizations build.">
    <title>{% block title %}Anva{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'anva/app.css' %}">
    <script src="{% static 'anva/app.js' %}" defer></script>
  </head>
  <body class="public-shell">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="public-header">
      <a class="brand" href="/" aria-label="Anva home">
        <svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="9" cy="28" r="4"></circle>
          <circle cx="20" cy="9" r="4"></circle>
          <circle cx="31" cy="28" r="4"></circle>
          <path d="M11 24 18 13M22 13l7 11M13 28h14"></path>
        </svg>
        <span>Anva</span>
      </a>
      <span class="version">Product {{ version }}</span>
    </header>
    <main id="main-content" class="public-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="public-footer">
      <span>Anva</span>
      <span>Connection · continuity · explainability</span>
    </footer>
  </body>
</html>
